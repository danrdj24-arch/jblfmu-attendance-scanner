<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>JBLFMU Molo Attendance Scanner</title>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #f2f5f9;

      color: #222;

    }


    .header {

      background: #003366;

      color: white;

      text-align: center;

      padding: 18px 10px;

    }


    .header h1 {

      margin: 0;

      font-size: 25px;

    }


    .header p {

      margin: 5px 0 0;

      font-size: 15px;

    }


    .container {

      width: 95%;

      max-width: 600px;

      margin: 20px auto;

    }


    .station {

      background: white;

      border-radius: 12px;

      padding: 15px;

      margin-bottom: 15px;

      text-align: center;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.12);

    }


    .station-name {

      font-size: 20px;

      font-weight: bold;

    }


    .station-location {

      color: #555;

      margin-top: 4px;

    }


    .online {

      margin-top: 8px;

      font-weight: bold;

      color: green;

    }


    #reader {

      width: 100%;

      background: black;

      border-radius: 12px;

      overflow: hidden;

    }


    .instruction {

      text-align: center;

      font-size: 18px;

      font-weight: bold;

      margin: 18px 0;

    }


    #result {

      background: white;

      border-radius: 12px;

      padding: 20px;

      min-height: 130px;

      box-shadow:
        0 2px 8px rgba(0,0,0,0.12);

      text-align: center;

    }


    .student-name {

      font-size: 24px;

      font-weight: bold;

      margin-bottom: 8px;

    }


    .student-info {

      font-size: 17px;

      margin: 5px;

    }


    .present {

      color: green;

      font-size: 25px;

      font-weight: bold;

      margin-top: 12px;

    }


    .late {

      color: red;

      font-size: 25px;

      font-weight: bold;

      margin-top: 12px;

    }


    .exit {

      color: #0066cc;

      font-size: 25px;

      font-weight: bold;

      margin-top: 12px;

    }


    .error {

      color: red;

      font-weight: bold;

    }


    .success {

      color: green;

      font-weight: bold;

    }


    .waiting {

      color: #555;

    }


    .footer {

      text-align: center;

      color: #777;

      font-size: 13px;

      margin: 20px;

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <div class="header">

    <h1>JBLFMU MOLO</h1>

    <p>
      Basic Education Department
    </p>

  </div>


  <div class="container">


    <!-- STATION -->

    <div class="station">

      <div class="station-name">
        MAIN GATE
      </div>

      <div class="station-location">
        JBLFMU Molo
      </div>

      <div class="online">
        ● STATION ONLINE
      </div>

    </div>


    <!-- INSTRUCTION -->

    <div class="instruction">

      SCAN STUDENT ID QR CODE

    </div>


    <!-- CAMERA -->

    <div id="reader"></div>


    <!-- RESULT -->

    <div id="result">

      <div class="waiting">

        Waiting for student QR code...

      </div>

    </div>


  </div>


  <!-- FOOTER -->

  <div class="footer">

    JBLFMU Molo Basic Education Attendance System

  </div>



<script>


/************************************************
 * SETTINGS
 ************************************************/


const APPS_SCRIPT_URL =

  "https://script.google.com/macros/s/AKfycbxVAhx9PVZqpo-WSFIDOoz-Vwqzrxus2EEIqdzkH_p94gfuUNhbt4SyYggZZjD9z3YA/exec";


const STATION_ID =

  "JBL-MOLO-GATE-01";


const STATION_TOKEN =

  "JBLMOLO-GATE-2026-8X7K";



/************************************************
 * SHOW MESSAGE
 ************************************************/


function showMessage(message, type) {

  const result =

    document.getElementById("result");


  result.innerHTML =

    '<div class="' +
    type +
    '">' +

    message +

    '</div>';

}



/************************************************
 * EXTRACT STUDENT ID
 ************************************************/


function extractStudentID(qrText) {

  qrText =

    String(qrText).trim();


  /*
   * QR CODE CONTAINS URL
   *
   * Example:
   *
   * https://.../exec?id=JBL-0001
   */

  try {

    const url =

      new URL(qrText);


    const id =

      url.searchParams.get("id");


    if (id) {

      return id.trim();

    }

  }

  catch (error) {

    /*
     * QR is not a URL.
     * Continue below.
     */

  }


  /*
   * QR CODE MAY CONTAIN
   * ONLY STUDENT ID
   */

  if (qrText !== "") {

    return qrText;

  }


  return "";

}



/************************************************
 * RECORD ATTENDANCE
 ************************************************/


function recordAttendance(studentId) {


  showMessage(

    "Processing attendance...",

    "waiting"

  );


  /*
   * CREATE UNIQUE JSONP CALLBACK
   */

  const callbackName =

    "attendanceCallback_" +

    Date.now();


  let finished = false;


  /*
   * SCRIPT VARIABLE
   *
   * Declared here so finish()
   * can remove it.
   */

  let script = null;



  /**********************************************
   * FINISH REQUEST
   **********************************************/

  function finish() {


    if (finished) {

      return;

    }


    finished = true;


    /*
     * Remove callback
     */

    try {

      delete window[callbackName];

    }

    catch (error) {

      console.log(error);

    }


    /*
     * Remove script element
     */

    if (

      script &&

      script.parentNode

    ) {

      script.parentNode.removeChild(script);

    }


    /*
     * Allow another QR scan

     */

    setTimeout(function() {

      processing = false;

    }, 1000);

  }



  /**********************************************
   * JSONP CALLBACK
   **********************************************/

  window[callbackName] =

    function(response) {


      console.log(

        "Attendance server response:",

        response

      );


      /*
       * EMPTY RESPONSE
       */

      if (!response) {


        showMessage(

          "❌ Empty response from attendance server.",

          "error"

        );


        finish();

        return;

      }



      /******************************************
       * SERVER RETURNED ERROR
       ******************************************/

      if (!response.success) {


        /*
         * DUPLICATE
         */

        if (response.duplicate) {


          document.getElementById("result")

            .innerHTML =


              "<div class='student-name'>" +

              (

                response.name ||

                response.student ||

                studentId

              ) +

              "</div>" +


              "<div class='student-info'>" +

              "Grade " +

              (response.grade || "") +

              " - " +

              (response.section || "") +

              "</div>" +


              "<div class='student-info'>" +

              "Time: " +

              (response.time || "") +

              "</div>" +


              "<div class='student-info'>" +

              "Status: " +

              (response.status || "") +

              "</div>" +


              "<div class='error'>" +

              "⚠ Attendance already recorded today" +

              "</div>";


          finish();

          return;

        }



        /*
         * NORMAL SERVER ERROR
         */

        showMessage(

          "❌ " +

          (

            response.message ||

            "Attendance server error."

          ),

          "error"

        );


        finish();

        return;

      }



      /******************************************
       * SUCCESS
       ******************************************/


      const name =

        response.name ||

        response.student ||

        studentId;


      const period =

        response.period || "";


      const status =

        response.status || "RECORDED";



      /*
       * STATUS DISPLAY
       */

      let statusHTML = "";



      /*
       * EXIT
       */

      if (period === "EXIT") {


        statusHTML =

          "<div class='exit'>" +

          "EXIT RECORDED" +

          "</div>";

      }


      /*
       * LATE
       */

      else if (status === "LATE") {


        statusHTML =

          "<div class='late'>" +

          "LATE" +

          "</div>";

      }


      /*
       * PRESENT
       */

      else {


        statusHTML =

          "<div class='present'>" +

          status +

          "</div>";

      }



      /*
       * DISPLAY STUDENT
       */

      document.getElementById("result")

        .innerHTML =


          "<div class='student-name'>" +

          name +

          "</div>" +


          "<div class='student-info'>" +

          "Student ID: " +

          (

            response.studentId ||

            studentId

          ) +

          "</div>" +


          "<div class='student-info'>" +

          "Grade " +

          (response.grade || "") +

          " - " +

          (response.section || "") +

          "</div>" +


          "<div class='student-info'>" +

          "Period: " +

          period +

          "</div>" +


          "<div class='student-info'>" +

          "Time: " +

          (response.time || "") +

          "</div>" +


          statusHTML;



      /*
       * WAIT 4 SECONDS
       */

      setTimeout(function() {


        document.getElementById("result")

          .innerHTML =


            "<div class='waiting'>" +

            "Waiting for student QR code..." +

            "</div>";


        finish();


      }, 4000);


    };



  /**********************************************
   * CREATE JSONP SCRIPT
   **********************************************/


  script =

    document.createElement("script");


  const url =

    APPS_SCRIPT_URL +

    "?action=record" +

    "&id=" +

    encodeURIComponent(studentId) +

    "&station=" +

    encodeURIComponent(STATION_ID) +

    "&token=" +

    encodeURIComponent(STATION_TOKEN) +

    "&callback=" +

    encodeURIComponent(callbackName) +

    "&_=" +

    Date.now();



  console.log(

    "Sending attendance request:",

    url

  );



  script.src = url;



  /*
   * NETWORK ERROR
   */

  script.onerror =

    function() {


      if (finished) {

        return;

      }


      showMessage(

        "❌ Unable to contact attendance server.",

        "error"

      );


      finish();

    };



  /*
   * ADD SCRIPT TO PAGE
   */

  document.body.appendChild(script);



  /**********************************************
   * SAFETY TIMEOUT
   **********************************************/

  setTimeout(function() {


    if (!finished) {


      showMessage(

        "❌ Attendance server did not respond.<br><br>" +

        "Please check the internet connection.",

        "error"

      );


      finish();

    }


  }, 10000);


}



/************************************************
 * QR SCAN CONTROL
 ************************************************/


let processing = false;



/************************************************
 * QR SCANNED
 ************************************************/


function onScanSuccess(decodedText) {


  /*
   * Ignore additional scans while
   * current request is processing.
   */

  if (processing) {

    return;

  }


  processing = true;


  console.log(

    "QR scanned:",

    decodedText

  );


  /*
   * GET STUDENT ID
   */

  const studentId =

    extractStudentID(decodedText);



  /*
   * INVALID QR
   */

  if (!studentId) {


    showMessage(

      "❌ Invalid student QR code.",

      "error"

    );


    setTimeout(function() {

      processing = false;

    }, 2000);


    return;

  }



  /*
   * SEND TO SERVER
   */

  recordAttendance(studentId);

}



/************************************************
 * QR SCANNER FAILURE
 ************************************************/


function onScanFailure(error) {

  /*
   * Normal scanning failures are ignored.
   */

}



/************************************************
 * START CAMERA
 ************************************************/


function startScanner() {


  const html5QrCode =

    new Html5Qrcode("reader");


  const config = {


    fps: 10,


    qrbox: {

      width: 250,

      height: 250

    }

  };



  html5QrCode.start(

    {

      facingMode: "environment"

    },


    config,


    onScanSuccess,


    onScanFailure

  )


  .catch(function(error) {


    console.error(error);


    showMessage(


      "❌ Camera could not start.<br><br>" +


      "Please allow camera permission " +

      "for this website.",


      "error"


    );


  });


}



/************************************************
 * START APPLICATION
 ************************************************/


window.addEventListener(

  "load",

  function() {


    startScanner();


  }

);


</script>


</body>

</html>
