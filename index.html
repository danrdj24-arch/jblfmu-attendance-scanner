<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>JBLFMU Molo Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #222;
    }

    .header {
      background: #003366;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 15px;
    }

    .container {
      width: 95%;
      max-width: 600px;
      margin: 20px auto;
    }

    .station {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .station-name {
      font-size: 20px;
      font-weight: bold;
    }

    .station-location {
      color: #555;
      margin-top: 4px;
    }

    .online {
      margin-top: 8px;
      font-weight: bold;
      color: green;
    }

    #reader {
      width: 100%;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    .instruction {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin: 18px 0;
    }

    #result {
      background: white;
      border-radius: 12px;
      padding: 20px;
      min-height: 120px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      text-align: center;
    }

    .student-name {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .student-info {
      font-size: 17px;
      margin: 5px;
    }

    .present {
      color: green;
      font-size: 25px;
      font-weight: bold;
      margin-top: 12px;
    }

    .late {
      color: red;
      font-size: 25px;
      font-weight: bold;
      margin-top: 12px;
    }

    .exit {
      color: #0066cc;
      font-size: 25px;
      font-weight: bold;
      margin-top: 12px;
    }

    .error {
      color: red;
      font-weight: bold;
      font-size: 18px;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .waiting {
      color: #555;
    }

    .footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin: 20px;
    }

  </style>

</head>


<body>

  <div class="header">

    <h1>JBLFMU MOLO</h1>

    <p>
      Basic Education Department
    </p>

  </div>


  <div class="container">

    <!-- STATION -->

    <div class="station">

      <div class="station-name">
        MAIN GATE
      </div>

      <div class="station-location">
        JBLFMU Molo
      </div>

      <div class="online">
        ● STATION ONLINE
      </div>

    </div>


    <!-- SCANNER -->

    <div class="instruction">
      SCAN STUDENT ID QR CODE
    </div>

    <div id="reader"></div>


    <!-- RESULT -->

    <div id="result">

      <div class="waiting">
        Waiting for student QR code...
      </div>

    </div>

  </div>


  <div class="footer">

    JBLFMU Molo Basic Education Attendance System

  </div>


<script>

/************************************************
 * SETTINGS
 ************************************************/

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbxVAhx9PVZqpo-WSFIDOoz-Vwqzrxus2EEIqdzkH_p94gfuUNhbt4SyYggZZjD9z3YA/exec";


const STATION_ID =
  "JBL-MOLO-GATE-01";


const STATION_TOKEN =
  "JBLMOLO-GATE-2026-8X7K";


/************************************************
 * PROCESSING CONTROL
 ************************************************/

let processing = false;


/************************************************
 * DISPLAY MESSAGE
 ************************************************/

function showMessage(message, type) {

  const result =
    document.getElementById("result");

  result.innerHTML =
    '<div class="' +
    type +
    '">' +
    message +
    '</div>';

}


/************************************************
 * RESET SCANNER
 ************************************************/

function resetScanner() {

  processing = false;

  document.getElementById("result").innerHTML =

    "<div class='waiting'>" +
    "Waiting for student QR code..." +
    "</div>";

}


/************************************************
 * EXTRACT STUDENT ID
 ************************************************/

function extractStudentID(qrText) {

  qrText =
    String(qrText).trim();


  /*
   * QR containing:
   *
   * https://.../exec?id=JBL-0001
   */

  try {

    const url =
      new URL(qrText);

    const id =
      url.searchParams.get("id");

    if (id) {

      return id.trim();

    }

  } catch (error) {

    // Not a URL.
    // Continue below.

  }


  /*
   * QR containing only:
   *
   * JBL-0001
   */

  if (qrText !== "") {

    return qrText;

  }


  return "";

}


/************************************************
 * RECORD ATTENDANCE
 ************************************************/

function recordAttendance(studentId) {

  showMessage(
    "Processing attendance...",
    "waiting"
  );


  /*
   * Unique JSONP callback
   */

  const callbackName =
    "attendanceCallback_" +
    Date.now();


  let finished = false;


  /*
   * Cleanup function
   */

  function cleanup() {

    finished = true;

    delete window[callbackName];

    if (
      script &&
      script.parentNode
    ) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  /*
   * CALLBACK
   */

  window[callbackName] =
    function(response) {

      if (finished) {
        return;
      }


      console.log(
        "Attendance server response:",
        response
      );


      /*
       * SERVER ERROR
       */

      if (
        !response ||
        response.success !== true
      ) {

        showMessage(

          "❌ " +
          (
            response &&
            response.message
              ? response.message
              : "Attendance server returned an error."
          ),

          "error"

        );


        cleanup();


        setTimeout(
          resetScanner,
          3000
        );


        return;

      }


      /*
       * SUCCESS
       */

      const studentName =
        response.student ||
        response.name ||
        studentId;


      const studentGrade =
        response.grade ||
        "";


      const studentSection =
        response.section ||
        "";


      const studentTime =
        response.time ||
        "";


      const studentStatus =
        response.status ||
        "";


      const studentPeriod =
        response.period ||
        "";


      let statusClass =
        "present";


      if (
        studentStatus === "LATE"
      ) {

        statusClass =
          "late";

      }


      if (
        studentPeriod === "EXIT"
      ) {

        statusClass =
          "exit";

      }


      /*
       * SHOW RESULT
       */

      document.getElementById("result")
        .innerHTML =

        "<div class='student-name'>" +
        studentName +
        "</div>" +

        "<div class='student-info'>" +
        "Student ID: " +
        studentId +
        "</div>" +

        (
          studentGrade
          ? "<div class='student-info'>" +
            "Grade " +
            studentGrade +
            (
              studentSection
              ? " - " +
                studentSection
              : ""
            ) +
            "</div>"
          : ""
        ) +

        "<div class='student-info'>" +
        "Time: " +
        studentTime +
        "</div>" +

        (
          studentPeriod
          ? "<div class='student-info'>" +
            "Period: " +
            studentPeriod +
            "</div>"
          : ""
        ) +

        "<div class='" +
        statusClass +
        "'>" +
        studentStatus +
        "</div>";


      cleanup();


      /*
       * Allow next scan after 4 seconds
       */

      setTimeout(
        resetScanner,
        4000
      );

    };


  /*
   * CREATE SCRIPT
   */

  const script =
    document.createElement(
      "script"
    );


  /*
   * BUILD REQUEST
   */

  const url =

    APPS_SCRIPT_URL +

    "?action=record" +

    "&id=" +
    encodeURIComponent(
      studentId
    ) +

    "&station=" +
    encodeURIComponent(
      STATION_ID
    ) +

    "&token=" +
    encodeURIComponent(
      STATION_TOKEN
    ) +

    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "Sending attendance request:",
    url
  );


  script.src =
    url;


  /*
   * SERVER CONNECTION ERROR
   */

  script.onerror =
    function() {

      if (finished) {
        return;
      }


      showMessage(

        "❌ Unable to connect to attendance server.",

        "error"

      );


      cleanup();


      setTimeout(
        resetScanner,
        3000
      );

    };


  document.body.appendChild(
    script
  );


  /*
   * TIMEOUT
   *
   * Prevents scanner from being stuck
   * forever on "Processing..."
   */

  setTimeout(
    function() {

      if (finished) {
        return;
      }


      showMessage(

        "❌ Attendance server did not respond.<br><br>" +
        "Please try scanning again.",

        "error"

      );


      cleanup();


      setTimeout(
        resetScanner,
        3000
      );


    },
    10000
  );

}


/************************************************
 * QR SCANNED
 ************************************************/

function onScanSuccess(
  decodedText
) {

  if (processing) {

    return;

  }


  processing = true;


  console.log(
    "QR scanned:",
    decodedText
  );


  const studentId =
    extractStudentID(
      decodedText
    );


  if (!studentId) {

    showMessage(

      "❌ Invalid student QR code.",

      "error"

    );


    setTimeout(
      resetScanner,
      2000
    );


    return;

  }


  recordAttendance(
    studentId
  );

}


/************************************************
 * QR SCANNER ERROR
 ************************************************/

function onScanFailure(
  error
) {

  /*
   * Normal QR scanning errors
   * are ignored.
   */

}


/************************************************
 * START CAMERA
 ************************************************/

function startScanner() {

  const html5QrCode =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    fps: 10,

    qrbox: {

      width: 250,

      height: 250

    }

  };


  html5QrCode.start(

    {
      facingMode:
        "environment"
    },

    config,

    onScanSuccess,

    onScanFailure

  )

  .catch(
    function(error) {

      console.error(
        error
      );


      showMessage(

        "❌ Camera could not start.<br><br>" +

        "Please allow camera permission " +
        "for this website.",

        "error"

      );

    }
  );

}


/************************************************
 * START
 ************************************************/

window.addEventListener(

  "load",

  function() {

    startScanner();

  }

);

</script>

</body>

</html>
